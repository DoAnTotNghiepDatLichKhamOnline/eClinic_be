server:
  port: 8080
  # Nén gzip response JSON khi client gửi Accept-Encoding: gzip
  compression:
    enabled: true

spring:
  application:
    name: api-gateway
  # Chạy bằng IntelliJ: đọc thêm .env ở thư mục gốc nếu có; biến môi trường vẫn được ưu tiên
  config:
    import: "optional:file:.env[.properties]"

  cloud:
    gateway:
      server:
        webmvc:
          # Proxy đứng trước gateway được tin để ghi X-Forwarded-For; service chỉ đọc phần tử cuối
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:.*}
          # /api/<service>/** về service đó, giữ nguyên đường dẫn; /api/auth, /api/users về identity-service
          routes:
            - id: identity-service
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/identity/**,/api/auth/**,/api/users/**
            - id: catalog-service
              uri: ${CATALOG_URL:http://localhost:8082}
              predicates:
                - Path=/api/catalog/**
            - id: booking-service
              uri: ${BOOKING_URL:http://localhost:8084}
              predicates:
                - Path=/api/booking/**
            - id: medical-service
              uri: ${MEDICAL_URL:http://localhost:8085}
              predicates:
                - Path=/api/medical/**
            - id: notification-service
              uri: ${NOTIFICATION_URL:http://localhost:8086}
              predicates:
                - Path=/api/notification/**
            - id: chatbot-service
              uri: ${CHATBOT_URL:http://localhost:8087}
              predicates:
                - Path=/api/chatbot/**
            - id: report-service
              uri: ${REPORT_URL:http://localhost:8088}
              predicates:
                - Path=/api/report/**

  # Thông điệp lỗi của gateway, chọn theo Accept-Language ("en..." tiếng Anh, còn lại tiếng Việt)
  messages:
    basename: thong-diep/gateway
    fallback-to-system-locale: false

  # Gọi service: quá hạn -> 504, service chưa chạy -> 503
  http:
    clients:
      connect-timeout: 2s
      read-timeout: ${GATEWAY_READ_TIMEOUT:30s}

  # Redis chỉ để đếm giới hạn tần suất; lỗi thì request vẫn được chuyển tiếp
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # Redis lỗi thì gateway vẫn chạy, nên không được báo DOWN
      enabled: false

app:
  gioi-han:
    # Body tối đa theo Content-Length (-> 413); phải nhỏ hơn max-swallow-size của service nhận upload (10MB)
    kich-thuoc-request-toi-da: ${GATEWAY_MAX_REQUEST_SIZE:5MB}
    # Số request tối đa của 1 IP trong 1 phút (-> 429); kiểm tra tải thì đặt cả 3 rất lớn
    so-yeu-cau-moi-phut: ${GATEWAY_RATE_LIMIT:300}
    # POST tới các đường dẫn xác thực bên dưới
    so-yeu-cau-xac-thuc-moi-phut: ${GATEWAY_AUTH_RATE_LIMIT:20}
    # POST /api/chatbot/** (tốn lượt gọi mô hình)
    so-yeu-cau-chatbot-moi-phut: ${GATEWAY_CHATBOT_RATE_LIMIT:30}
    duong-dan-xac-thuc:
      - /api/auth/login
      - /api/auth/google
      - /api/auth/register
      - /api/auth/forgot-password
      - /api/auth/resend-verification
  cors:
    # Địa chỉ frontend được gọi API (phân cách bằng dấu phẩy); CORS chỉ cấu hình ở gateway
    nguon-duoc-phep: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
