# Docker cho eClinic backend: "docker compose up -d" chỉ chạy hạ tầng (MySQL, Redis, phpMyAdmin 8090),
# "docker compose --profile app up -d --build" chạy thêm 7 service + api-gateway (8080).
# Container chỉ nhận các biến khai báo trong "environment:" (không dùng env_file để .env không lọt vào container).

name: eclinic

# ---- Cấu hình dùng chung cho các service ứng dụng (YAML anchor; "<<:" chỉ gộp 1 cấp) ----

x-dich-vu: &dich-vu
  profiles: [app]
  restart: unless-stopped
  mem_limit: 512m

x-kiem-tra-suc-khoe: &kiem-tra
  interval: 10s
  timeout: 5s
  retries: 12
  # 8 JVM khởi động cùng lúc nên cho thời gian khởi động dài
  start_period: 120s

x-java: &java-tool-options
  # Serial GC và chỉ C1 (TieredStopAtLevel=1): đã đo, bật C2 làm booking-service vượt 512MB; chỉ bỏ khi nâng mem_limit
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1

x-moi-truong-chung: &moi-truong-chung
  <<: *java-tool-options
  # Trong mạng Docker gọi MySQL/Redis bằng tên service và cổng trong container (không dùng DB_PORT/REDIS_PORT)
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-eclinic}
  DB_USERNAME: ${DB_USERNAME:-eclinic}
  DB_PASSWORD: ${DB_PASSWORD:-eclinic}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Mặc định giống application-common.yml; không để trống vì biến rỗng ghi đè mặc định của Spring
  JWT_SECRET: ${JWT_SECRET:-eclinic-dev-secret-chi-dung-o-may-local-khong-dung-that-2026}
  JWT_TTL: ${JWT_TTL:-30m}
  # Khoá của API nội bộ /noi-bo/**, giống nhau ở mọi service
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-eclinic-dev-khoa-noi-bo-chi-dung-o-may-local-khong-dung-that}

services:
  # ================= Hạ tầng (luôn chạy) =================
  mysql:
    image: mysql:8.4
    container_name: eclinic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-eclinic}
      MYSQL_USER: ${DB_USERNAME:-eclinic}
      MYSQL_PASSWORD: ${DB_PASSWORD:-eclinic}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: eclinic-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: eclinic-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8090}:80"
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      # Spring Boot docker-compose support bỏ qua service này (không phải service connection)
      org.springframework.boot.ignore: "true"

  # ================= Ứng dụng (chỉ chạy với --profile app) =================
  # Tên service phải khớp địa chỉ api-gateway dùng; mỗi service mở cổng riêng để xem Swagger

  identity-service:
    <<: *dich-vu
    build: { context: ., args: { MODULE: identity-service } }
    container_name: eclinic-identity-service
    ports:
      - "8081:8081"
    environment:
      <<: *moi-truong-chung
      # Tài khoản quản trị tạo khi khởi động lần đầu (chưa có admin nào)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eclinic.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      # Dữ liệu mẫu để demo; triển khai thật đặt SEED_DATA=false
      SEED_DATA: ${SEED_DATA:-true}
      # Thêm khoảng 100 dòng mỗi bảng; chỉ có tác dụng khi SEED_DATA=true
      SEED_VOLUME: ${SEED_VOLUME:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-Demo@123}
      # Email kích hoạt / đặt lại mật khẩu; console chỉ ghi liên kết ra log
      MAIL_MODE: ${MAIL_MODE:-console}
      # Mật khẩu ban đầu của bác sĩ do quản trị viên tạo (phải đổi ở lần đăng nhập đầu)
      DOCTOR_DEFAULT_PASSWORD: ${DOCTOR_DEFAULT_PASSWORD:-Doctor@123}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Đăng nhập Google; để trống thì /api/auth/google trả 503
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Kho ảnh Cloudinary; thiếu giá trị thì upload ảnh đại diện trả 503
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-eclinic}
      # Cookie refresh token chỉ gửi qua HTTPS; false chỉ khi thử qua IP LAN bằng http
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    healthcheck:
      <<: *kiem-tra
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-service:
    <<: *dich-vu
    build: { context: ., args: { MODULE: catalog-service } }
    container_name: eclinic-catalog-service
    ports:
      - "8082:8082"
    environment:
      <<: *moi-truong-chung
      # Kho ảnh giới thiệu bác sĩ, cùng tài khoản Cloudinary với identity-service; thiếu giá trị thì trả 503
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-eclinic}
      # Quản lý bác sĩ gọi API nội bộ của 2 service này
      IDENTITY_URL: http://identity-service:8081
      BOOKING_URL: http://booking-service:8084
    healthcheck:
      <<: *kiem-tra
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy
      # service_started, không chờ healthy: Redis chỉ làm cache, lỗi thì đọc thẳng DB
      redis:
        condition: service_started

  booking-service:
    <<: *dich-vu
    build: { context: ., args: { MODULE: booking-service } }
    container_name: eclinic-booking-service
    ports:
      - "8084:8084"
    environment:
      <<: *moi-truong-chung
      # Link phiếu khám (nội dung mã QR) trỏ về frontend: FRONTEND_URL/phieu-kham/<mã>
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Giới hạn khi đặt lịch
      BOOKING_MIN_LEAD: ${BOOKING_MIN_LEAD:-30m}
      BOOKING_MAX_DAYS: ${BOOKING_MAX_DAYS:-30}
      BOOKING_MAX_ACTIVE_PER_PATIENT: ${BOOKING_MAX_ACTIVE_PER_PATIENT:-3}
      BOOKING_MAX_ACTIVE_PER_PHONE: ${BOOKING_MAX_ACTIVE_PER_PHONE:-5}
      BOOKING_IP_LIMIT: ${BOOKING_IP_LIMIT:-20}
      BOOKING_IP_WINDOW: ${BOOKING_IP_WINDOW:-10m}
      BOOKING_CHANGE_LEAD: ${BOOKING_CHANGE_LEAD:-2h}
      BOOKING_MAX_RESCHEDULES: ${BOOKING_MAX_RESCHEDULES:-2}
      # Giới hạn khách tự xin cấp lại liên kết phiếu khám
      RELINK_CODE_LIMIT: ${RELINK_CODE_LIMIT:-3}
      RELINK_IP_LIMIT: ${RELINK_IP_LIMIT:-10}
      RELINK_WINDOW: ${RELINK_WINDOW:-1h}
      # Nhắc lịch khám
      BOOKING_REMINDER_BEFORE: ${BOOKING_REMINDER_BEFORE:-3d,1d}
      BOOKING_REMINDER_INTERVAL: ${BOOKING_REMINDER_INTERVAL:-5m}
      BOOKING_REMINDER_FROM: ${BOOKING_REMINDER_FROM:-07:00}
      BOOKING_REMINDER_TO: ${BOOKING_REMINDER_TO:-21:00}
      BOOKING_REMINDER_MIN_LEAD: ${BOOKING_REMINDER_MIN_LEAD:-2h}
      # Nhắc tái khám
      FOLLOWUP_REMINDER_DAYS: ${FOLLOWUP_REMINDER_DAYS:-7}
      FOLLOWUP_BOOKING_PATH: ${FOLLOWUP_BOOKING_PATH:-/dat-lich}
      # Ca làm việc: hạn gửi yêu cầu đổi ca, số ngày tới được xếp ca
      SHIFT_REQUEST_LEAD: ${SHIFT_REQUEST_LEAD:-24h}
      SHIFT_MAX_DAYS: ${SHIFT_MAX_DAYS:-90}
      SHIFT_MAX_WEEKLY_HOURS: ${SHIFT_MAX_WEEKLY_HOURS:-48}
      DOCTOR_SCHEDULE_PATH: ${DOCTOR_SCHEDULE_PATH:-/doctor/work-schedule}
      # Hạn sửa hồ sơ bệnh án, trả cho màn hình của bác sĩ
      RECORD_EDIT_DAYS: ${RECORD_EDIT_DAYS:-7}
      # Gửi sự kiện thẳng sang notification-service; không depends_on vì thông báo nằm chờ được
      NOTIFICATION_URL: http://notification-service:8086
      BOOKING_NOTIFY_INTERVAL: ${BOOKING_NOTIFY_INTERVAL:-5s}
      BOOKING_NOTIFY_CLEANUP_CRON: ${BOOKING_NOTIFY_CLEANUP_CRON:-0 30 3 * * *}
    healthcheck:
      <<: *kiem-tra
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  medical-service:
    <<: *dich-vu
    build: { context: ., args: { MODULE: medical-service } }
    container_name: eclinic-medical-service
    ports:
      - "8085:8085"
    environment:
      <<: *moi-truong-chung
      # Hạn sửa hồ sơ bệnh án
      RECORD_EDIT_DAYS: ${RECORD_EDIT_DAYS:-7}
      # Link sổ khám trả cho bác sĩ: FRONTEND_URL/so-kham/<mã>
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    healthcheck:
      <<: *kiem-tra
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy

  notification-service:
    <<: *dich-vu
    build: { context: ., args: { MODULE: notification-service } }
    container_name: eclinic-notification-service
    ports:
      - "8086:8086"
    environment:
      <<: *moi-truong-chung
      # Email lịch hẹn; mặc định theo MAIL_MODE, console chỉ ghi ra log
      NOTIFICATION_MAIL_MODE: ${NOTIFICATION_MAIL_MODE:-${MAIL_MODE:-console}}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      NOTIFICATION_MAIL_INTERVAL: ${NOTIFICATION_MAIL_INTERVAL:-5s}
      NOTIFICATION_MAIL_RETRY_WAITS: ${NOTIFICATION_MAIL_RETRY_WAITS:-1m,5m,30m,2h}
      NOTIFICATION_MAIL_CLEANUP_CRON: ${NOTIFICATION_MAIL_CLEANUP_CRON:-0 40 3 * * *}
    healthcheck:
      <<: *kiem-tra
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy

  chatbot-service:
    <<: *dich-vu
    build: { context: ., args: { MODULE: chatbot-service } }
    container_name: eclinic-chatbot-service
    ports:
      - "8087:8087"
    environment:
      <<: *moi-truong-chung
      # Mô hình ngôn ngữ (API kiểu OpenAI); thiếu CHATBOT_API_KEY thì gửi tin nhắn trả 503
      CHATBOT_BASE_URL: ${CHATBOT_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      CHATBOT_API_KEY: ${CHATBOT_API_KEY:-}
      CHATBOT_MODEL: ${CHATBOT_MODEL:-gemini-3.8-flash}
      CHATBOT_REASONING_EFFORT: ${CHATBOT_REASONING_EFFORT-low}
      CHATBOT_TIMEOUT: ${CHATBOT_TIMEOUT:-20s}
      CHATBOT_TOTAL_TIMEOUT: ${CHATBOT_TOTAL_TIMEOUT:-27s}
      CHATBOT_MAX_MODEL_CALLS: ${CHATBOT_MAX_MODEL_CALLS:-3}
      CHATBOT_PERSONAL_DATA: ${CHATBOT_PERSONAL_DATA:-true}
      # Tra cứu bác sĩ, lịch khám còn chỗ qua API công khai (gọi thẳng, không qua gateway)
      CATALOG_URL: http://catalog-service:8082
      BOOKING_URL: http://booking-service:8084
      CHATBOT_MAX_TOKENS: ${CHATBOT_MAX_TOKENS:-2048}
      CHATBOT_LIMIT_MESSAGES: ${CHATBOT_LIMIT_MESSAGES:-20}
      CHATBOT_LIMIT_WINDOW: ${CHATBOT_LIMIT_WINDOW:-10m}
      CHATBOT_LIMIT_DAILY: ${CHATBOT_LIMIT_DAILY:-100}
      CHATBOT_LIMIT_SESSIONS: ${CHATBOT_LIMIT_SESSIONS:-10}
      CHATBOT_LIMIT_TOTAL_DAILY: ${CHATBOT_LIMIT_TOTAL_DAILY:-1000}
    healthcheck:
      <<: *kiem-tra
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  report-service:
    <<: *dich-vu
    build: { context: ., args: { MODULE: report-service } }
    container_name: eclinic-report-service
    ports:
      - "8088:8088"
    environment:
      <<: *moi-truong-chung
    healthcheck:
      <<: *kiem-tra
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/actuator/health"]
    depends_on:
      mysql:
        condition: service_healthy

  # Gateway không chờ các service: service nào chưa lên thì gateway trả 503 cho service đó.
  api-gateway:
    <<: *dich-vu
    build: { context: ., args: { MODULE: api-gateway } }
    container_name: eclinic-api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *java-tool-options
      IDENTITY_URL: http://identity-service:8081
      CATALOG_URL: http://catalog-service:8082
      BOOKING_URL: http://booking-service:8084
      MEDICAL_URL: http://medical-service:8085
      NOTIFICATION_URL: http://notification-service:8086
      CHATBOT_URL: http://chatbot-service:8087
      REPORT_URL: http://report-service:8088
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      GATEWAY_READ_TIMEOUT: ${GATEWAY_READ_TIMEOUT:-30s}
      # Body request tối đa tại gateway (vượt -> 413); phải nhỏ hơn max-swallow-size của service nhận upload (10MB)
      GATEWAY_MAX_REQUEST_SIZE: ${GATEWAY_MAX_REQUEST_SIZE:-5MB}
      # Regex các proxy đứng trước gateway được tin khi ghi X-Forwarded-For
      GATEWAY_TRUSTED_PROXIES: "${GATEWAY_TRUSTED_PROXIES:-.*}"
      # Số request tối đa của 1 IP trong 1 phút, đếm trên Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-300}
      GATEWAY_AUTH_RATE_LIMIT: ${GATEWAY_AUTH_RATE_LIMIT:-20}
      GATEWAY_CHATBOT_RATE_LIMIT: ${GATEWAY_CHATBOT_RATE_LIMIT:-30}
    # service_started, không chờ healthy: Redis lỗi thì gateway bỏ qua giới hạn tần suất và vẫn chạy
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      <<: *kiem-tra
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]

volumes:
  mysql_data:
  redis_data:
