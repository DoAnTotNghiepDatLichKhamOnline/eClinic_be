name: CI

# Runs the full test suite on PRs into main and on pushes to any other branch.
# deploy.yml calls this same workflow (workflow_call) before deploying main.
on:
  pull_request:
    branches: [main]
  push:
    # Dependabot branches are tested by their pull_request run only.
    branches-ignore: [main, 'dependabot/**']
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push to a feature branch cancels its older run; a test run on main (gating deploy) is never cancelled.
    concurrency:
      group: test-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7
