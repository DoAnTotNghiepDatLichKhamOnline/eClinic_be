name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

  deploy:
    name: Deploy to VM
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    steps:
      - name: Update and restart the stack over SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: huythanhyasuo
          key: ${{ secrets.VM_SSH_KEY }}
          fingerprint: ${{ secrets.VM_SSH_FINGERPRINT }}
          command_timeout: 40m
          envs: GH_TOKEN,REPO,SHA
          script: |
            set -e
            cd ~/eClinic_be
            git -c credential.helper= fetch "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" main
            git reset --hard "$SHA"
            dc="docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app"
            $dc up -d --build --wait --wait-timeout 900
            docker image prune -f
            $dc ps
