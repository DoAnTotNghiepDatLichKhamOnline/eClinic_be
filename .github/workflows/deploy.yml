name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  images:
    name: Build images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          source: .
          push: true
          vars: |
            TAG=${{ github.sha }}
          set: |
            *.cache-from=type=gha,scope=eclinic
            *.cache-to=type=gha,scope=eclinic,mode=max

  deploy:
    name: Deploy to VM
    needs: [test, images]
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    steps:
      - name: Update and restart the stack over SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: huythanhyasuo
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 40m
          envs: GH_TOKEN,ACTOR,REPO,SHA
          script: |
            set -e

            # Tự động quét và chấp nhận Host Key của VM/DuckDNS để tránh lỗi fingerprint mismatch
            mkdir -p ~/.ssh
            ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
            chmod 600 ~/.ssh/known_hosts

            cd ~/eClinic_be
            prev=$(git rev-parse HEAD)
            git -c credential.helper= fetch "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" main
            git reset --hard "$SHA"

            # Dump the DB before compose up (Flyway runs at startup). A failed dump puts the old checkout back and stops.
            bash deploy/vm-backup.sh "$prev" "$SHA" || { git reset --hard "$prev"; exit 1; }

            dc="docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app"
            apps="identity-service catalog-service booking-service medical-service notification-service chatbot-service report-service api-gateway"

            # Pull only the app images CI just pushed; mysql/redis/caddy/phpmyadmin keep their current image.
            echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            IMAGE_TAG="$SHA" $dc pull --quiet $apps || { docker logout ghcr.io; git reset --hard "$prev"; exit 1; }
            docker logout ghcr.io

            # Keep the deployed tag in .env so manual "docker compose" commands on the VM use the same images.
            (umask 077; { grep -v '^IMAGE_TAG=' .env || true; echo "IMAGE_TAG=$SHA"; } > .env.tmp)
            cat .env.tmp > .env && rm -f .env.tmp

            $dc up -d --no-build --wait --wait-timeout 900

            # Drop app images of older commits (a rollback pulls them again from GHCR).
            docker images --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/doantotnghiepdatlichkhamonline/eclinic-' | grep -v ":$SHA\$" | xargs -r docker rmi || true
            docker image prune -f
            $dc ps
