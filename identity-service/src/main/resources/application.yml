server:
  port: 8081
  tomcat:
    # Phải lớn hơn giới hạn request của gateway (5MB), không thì upload quá lớn ra 502 thay vì 413
    max-swallow-size: 10MB

spring:
  application:
    name: identity-service
  config:
    import: classpath:application-common.yml

  servlet:
    multipart:
      # Ảnh đại diện tối đa 2MB, vượt -> 413 TEP_QUA_LON
      max-file-size: 2MB
      max-request-size: 3MB

  # Gmail SMTP (MAIL_APP_PASSWORD là App Password), chỉ dùng khi app.email.che-do = smtp
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      # Không để thread gửi mail treo khi SMTP không phản hồi (ms)
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

management:
  health:
    mail:
      # Tắt: health check sẽ đăng nhập Gmail ở mỗi lần docker kiểm tra
      enabled: false

app:
  email:
    # console: chỉ ghi email + liên kết ra log; smtp: gửi qua Gmail
    che-do: ${MAIL_MODE:console}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    duong-dan-xac-thuc: /verify-email
    duong-dan-dat-lai: /reset-password
    duong-dan-doi-email: /confirm-email-change
  lien-ket:
    thoi-han-xac-thuc-email: 24h
    thoi-gian-cho-gui-lai: 60s
    thoi-han-dat-lai-mat-khau: 15m
    thoi-han-doi-email: 1h
  bac-si:
    # Mật khẩu ban đầu của bác sĩ do quản trị viên tạo, chỉ dùng để đặt mật khẩu mới ở lần đăng nhập đầu
    mat-khau-mac-dinh: ${DOCTOR_DEFAULT_PASSWORD:Doctor@123}
  dang-nhap:
    so-lan-sai-toi-da: 5
    thoi-gian-khoa: 15m
    thoi-han-refresh-token: 7d
    # Token đã thu hồi dùng lại trong khoảng này coi như 2 tab cùng làm mới; quá khoảng này coi như bị lộ
    an-han-dung-lai: 10s
  # Cookie HttpOnly eclinic_rt; COOKIE_SECURE=false chỉ khi thử qua IP mạng LAN bằng http
  cookie-phien:
    secure: ${COOKIE_SECURE:true}
    same-site: Strict
  google:
    # Để trống thì đăng nhập Google trả 503
    client-id: ${GOOGLE_CLIENT_ID:}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    thoi-gian-cho: 5s
  # Ảnh đại diện lưu ở <thu-muc>/avatar/<idTaiKhoan>
  cloudinary:
    bat: true
  anh-dai-dien:
    so-lan-tai-len-toi-da: 10
    khoang-dem: 1h
  bao-mat:
    duong-dan-cong-khai:
      - POST /api/auth/register
      - POST /api/auth/verify-email
      - POST /api/auth/resend-verification
      - POST /api/auth/login
      - POST /api/auth/first-password
      - POST /api/auth/refresh-token
      - POST /api/auth/logout
      - POST /api/auth/forgot-password
      - POST /api/auth/reset-password
      - POST /api/auth/google
      - POST /api/auth/confirm-email-change
      # API nội bộ cho catalog-service: kiểm tra khoá nội bộ thay cho JWT
      - POST /noi-bo/tai-khoan/**
      - PUT /noi-bo/tai-khoan/**
      - DELETE /noi-bo/tai-khoan/**
  admin-mac-dinh:
    email: ${ADMIN_EMAIL:admin@eclinic.local}
    # Đổi mặc định thì đổi cả KhoiTaoAdminRunner.MAT_KHAU_MAC_DINH
    mat-khau: ${ADMIN_PASSWORD:Admin@123}
  # Dữ liệu mẫu để thử / demo: 8 chuyên khoa, 12 bác sĩ, 6 bệnh nhân, ca cho so-ngay ngày tới
  du-lieu-mau:
    bat: ${SEED_DATA:false}
    # Thêm khoảng 100 dòng mỗi bảng (DuLieuMauLon), chỉ có tác dụng khi bat = true
    lon: ${SEED_VOLUME:false}
    mat-khau: ${SEED_PASSWORD:Demo@123}
    so-ngay: 14
