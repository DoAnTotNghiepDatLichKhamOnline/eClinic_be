spring:
  application:
    name: be_webSatLichKham

  # Khi chạy app ở máy dev, spring-boot-docker-compose sẽ tự `docker compose up` file docker-compose.yml
  # và tự lấy thông tin kết nối MySQL/Redis từ đó (ghi đè datasource/redis bên dưới).
  docker:
    compose:
      file: docker-compose.yml
      lifecycle-management: start-only

  datasource:
    # Không set serverTimezone/hibernate.jdbc.time_zone: DATETIME lưu đúng giờ "tường" (LocalDateTime),
    # JVM được set mặc định Asia/Ho_Chi_Minh trong BeWebSatLichKhamApplication.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eclinic}?characterEncoding=UTF-8
    username: ${DB_USERNAME:eclinic}
    password: ${DB_PASSWORD:eclinic}

  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý (src/main/resources/db/migration). Hibernate chỉ kiểm tra entity khớp schema.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  otp:
    ttl: 300s
    max-attempts: 5
    length: 6
