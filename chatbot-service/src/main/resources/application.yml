server:
  port: 8087

spring:
  application:
    name: chatbot-service
  config:
    import: classpath:application-common.yml
  # Redis chỉ dùng để giới hạn số tin nhắn / số phiên chat; thời gian chờ đặt chung trong application-common.yml

app:
  bao-mat:
    # Không cần đăng nhập: khách chứng minh phiên bằng mã bí mật ở header X-Chat-Khach
    duong-dan-cong-khai:
      - POST /api/chatbot/phien
      - POST /api/chatbot/phien/*/tin-nhan
      - GET /api/chatbot/phien/*/tin-nhan
  chatbot:
    # Mô hình gọi qua API kiểu OpenAI, mặc định Gemini; để trống khoá thì chatbot tắt (gửi tin nhắn trả 503)
    url-goc: ${CHATBOT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    khoa-api: ${CHATBOT_API_KEY:}
    mo-hinh: ${CHATBOT_MODEL:gemini-3.8-flash}
    # reasoning_effort gửi kèm (minimal / low / medium / high); để trống = không gửi (nhà cung cấp không hỗ trợ)
    muc-suy-luan: ${CHATBOT_REASONING_EFFORT:low}
    # Thời gian chờ của 1 lần gọi mô hình
    thoi-gian-cho: ${CHATBOT_TIMEOUT:20s}
    # Tổng thời gian của 1 tin nhắn phải nhỏ hơn read-timeout của gateway (30s) để ra 503 chứ không 504
    tong-thoi-gian-cho: ${CHATBOT_TOTAL_TIMEOUT:27s}
    so-lan-goi-mo-hinh-toi-da: ${CHATBOT_MAX_MODEL_CALLS:3}
    # Gọi thẳng API công khai của catalog-service và booking-service; lỗi thì chỉ thiếu gợi ý
    catalog-url: ${CATALOG_URL:http://localhost:8082}
    booking-url: ${BOOKING_URL:http://localhost:8084}
    # Cho chatbot đọc lịch hẹn của chính bệnh nhân (sau khi họ đồng ý); false là chỉ dùng dữ liệu công khai
    tra-cuu-ca-nhan: ${CHATBOT_PERSONAL_DATA:true}
    # max_tokens của 1 câu trả lời, tính cả phần suy luận
    so-token-tra-loi-toi-da: ${CHATBOT_MAX_TOKENS:2048}
    # Số tin nhắn gần nhất của phiên gửi kèm cho mô hình
    so-tin-nhan-lich-su: 10
    # Giới hạn theo tài khoản hoặc IP, đếm trên Redis (Redis lỗi thì bỏ qua)
    so-tin-nhan-moi-cua-so: ${CHATBOT_LIMIT_MESSAGES:20}
    cua-so: ${CHATBOT_LIMIT_WINDOW:10m}
    so-tin-nhan-moi-ngay: ${CHATBOT_LIMIT_DAILY:100}
    so-phien-moi-gio: ${CHATBOT_LIMIT_SESSIONS:10}
    # Số lần gọi mô hình của cả hệ thống trong 24 giờ, để không dùng hết hạn mức miễn phí
    so-tin-nhan-toan-he-thong-moi-ngay: ${CHATBOT_LIMIT_TOTAL_DAILY:1000}
