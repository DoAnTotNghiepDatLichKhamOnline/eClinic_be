baoCao.ghiChu.1=Appointments in the period: appointments whose slot starts in the period. The old booking of a reschedule is not counted, so a reschedule is one appointment.
baoCao.ghiChu.2=Visits: appointments that were seen. Patients seen (unique): each patient record (unique by ID card number) counts once, however many visits.
baoCao.ghiChu.3=Cancelled: by the patient + by the doctor + by the admin. Cancellation rate = cancelled / appointments in the period.
baoCao.ghiChu.4=No-show rate = no-shows / (seen + no-shows): only appointments whose attendance is known, so upcoming ones do not lower the rate.
baoCao.ghiChu.5=Slot utilisation = booked slots / all slots of the active shifts in the period. Cancelled shifts and hospital closure days are left out; a no-show still counts as a booked slot.
baoCao.ghiChu.6=Booking lead time = slot start - time of booking (for a rescheduled booking: time of the reschedule).
baoCao.ghiChu.7=New bookings: appointments created in the period (except the old booking of a reschedule), counted as the dashboard counts bookings this month.
baoCao.ghiChu.8=The specialty is the doctor current specialty. Working doctors is a current figure, not per period; new patient accounts are not filtered by specialty.
baoCao.ghiChu.9=Rates are percentages rounded to 1 decimal place, left blank when there is nothing to compute them from.
