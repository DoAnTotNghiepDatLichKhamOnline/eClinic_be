# ----- Ràng buộc không ghi message (@Min, @NotNull...): khoá chuẩn của Bean Validation -----
# Dòng kiểm tra dữ liệu chỉ dùng tham số có tên ({min}, {max}, {value}) và viết dấu nháy đơn bình thường.
jakarta.validation.constraints.Min.message=must be at least {value}
jakarta.validation.constraints.Max.message=must be at most {value}
jakarta.validation.constraints.NotNull.message=is required
jakarta.validation.constraints.NotBlank.message=is required
jakarta.validation.constraints.NotEmpty.message=is required
jakarta.validation.constraints.Size.message=must be between {min} and {max} in length
jakarta.validation.constraints.Positive.message=must be greater than 0
jakarta.validation.constraints.PositiveOrZero.message=must be 0 or greater
jakarta.validation.constraints.Email.message=is not a valid email address
jakarta.validation.constraints.Pattern.message=has an invalid format
jakarta.validation.constraints.Future.message=must be in the future
jakarta.validation.constraints.FutureOrPresent.message=must not be in the past
jakarta.validation.constraints.Past.message=must be in the past
jakarta.validation.constraints.PastOrPresent.message=must not be in the future

