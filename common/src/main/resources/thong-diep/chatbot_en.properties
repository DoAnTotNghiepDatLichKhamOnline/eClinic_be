# chatbot-service (UC-CHAT-01). English; the Vietnamese file is chatbot.properties.
chatbot.loiChao=Hello! I am the AI assistant of eClinic. I can guide you through booking an appointment, looking up your ticket, rescheduling or cancelling, and answer general health questions. What I say is general information only and does not replace an examination or advice from a doctor. In an emergency, call 115.
chatbot.ngoaiPhamVi=Sorry, this question is out of scope for me. I can only help with the services of this clinic on this site and with general health questions.
chatbot.khanCap=What you describe may be an emergency. Call 115 now or go to the nearest emergency department; do not wait for an appointment. If someone is nearby, ask them for help. I am an AI assistant and cannot handle emergencies.
kiemTra.tinNhanChat.batBuoc=The message must not be empty
kiemTra.tinNhanChat.toiDa=The message must be at most 1000 characters
loi.CHAT_QUA_NHIEU=You are sending messages too fast, please try again in a few minutes
loi.CHAT_QUA_NHIEU.moPhien=You have opened too many chat sessions, please try again later
loi.CHAT_QUA_NHIEU.moiNgay=You have used all of your messages for today, please come back tomorrow
loi.CHAT_QUA_NHIEU.toanHeThong=The assistant has no answers left for today, please come back tomorrow
loi.CHATBOT_KHONG_KHA_DUNG=The assistant cannot answer right now, please send your message again in a few minutes
loi.KHONG_TIM_THAY.phienChat=Chat session not found
chatbot.canDongY=To answer this I need to read your own appointments and visits. If you agree, the following is sent to the external AI service that runs this assistant: visit date and time, doctor, specialty, room, appointment status and the follow-up date your doctor recommended. Names, booking codes, the reason for a visit, diagnoses, advice and prescriptions are not sent. Press Agree and send your question again; you can withdraw your agreement at any time. If you do not agree, you can still see all of this under Appointments and Visit history.
thanhCong.dongYChat=Agreement recorded, please send your question again
thanhCong.rutDongYChat=Agreement withdrawn
