# chatbot-service (tiếng Việt): câu chatbot.* do server viết, lưu nguyên vào tin nhắn, không có tham số.
chatbot.loiChao=Xin chào! Tôi là trợ lý ảo (AI) của phòng khám eClinic. Tôi có thể hướng dẫn bạn đặt lịch khám, tra cứu phiếu khám, đổi hoặc hủy lịch hẹn và trả lời các câu hỏi sức khỏe thông thường. Thông tin tôi đưa ra chỉ để tham khảo, không thay thế việc thăm khám và tư vấn của bác sĩ. Trường hợp khẩn cấp, hãy gọi 115.
chatbot.ngoaiPhamVi=Xin lỗi, câu hỏi này nằm ngoài phạm vi hỗ trợ của tôi. Tôi chỉ hỗ trợ về các dịch vụ của phòng khám trên trang này và các câu hỏi sức khỏe thông thường.
chatbot.khanCap=Những dấu hiệu bạn mô tả có thể là tình trạng khẩn cấp. Hãy gọi ngay 115 hoặc đến khoa cấp cứu gần nhất, đừng chờ đặt lịch khám. Nếu có người ở gần, hãy nhờ họ giúp. Tôi là trợ lý AI nên không thể xử lý tình huống khẩn cấp.
kiemTra.tinNhanChat.batBuoc=Tin nhắn không được để trống
kiemTra.tinNhanChat.toiDa=Tin nhắn tối đa 1000 ký tự
loi.CHAT_QUA_NHIEU=Bạn gửi tin nhắn quá nhanh, vui lòng thử lại sau ít phút
loi.CHAT_QUA_NHIEU.moPhien=Bạn mở quá nhiều phiên chat, vui lòng thử lại sau
loi.CHAT_QUA_NHIEU.moiNgay=Bạn đã gửi hết số tin nhắn của hôm nay, vui lòng quay lại vào ngày mai
loi.CHAT_QUA_NHIEU.toanHeThong=Trợ lý ảo đã hết lượt trả lời của hôm nay, vui lòng quay lại vào ngày mai
loi.CHATBOT_KHONG_KHA_DUNG=Trợ lý ảo tạm thời không trả lời được, vui lòng gửi lại sau ít phút
loi.KHONG_TIM_THAY.phienChat=Không tìm thấy phiên chat
chatbot.canDongY=Để trả lời câu hỏi này, tôi cần đọc lịch hẹn và các lượt khám của chính bạn. Nếu bạn đồng ý, các thông tin sau sẽ được gửi tới dịch vụ AI bên ngoài đang vận hành trợ lý này: ngày giờ khám, bác sĩ, chuyên khoa, phòng khám, trạng thái lịch hẹn và ngày tái khám bác sĩ đề xuất. Họ tên, mã lịch hẹn, lý do khám, chẩn đoán, lời dặn và đơn thuốc không được gửi đi. Hãy bấm Đồng ý rồi gửi lại câu hỏi; bạn có thể rút lại đồng ý bất cứ lúc nào. Nếu không đồng ý, bạn vẫn xem được các thông tin này ở mục Lịch hẹn và Lịch sử khám.
thanhCong.dongYChat=Đã ghi nhận đồng ý, bạn hãy gửi lại câu hỏi
thanhCong.rutDongYChat=Đã rút lại đồng ý
