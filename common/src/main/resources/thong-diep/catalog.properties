loi.DU_LIEU_KHONG_HOP_LE.sapXepAnh=Danh sách phải gồm đúng id của mọi ảnh giới thiệu của bác sĩ, mỗi ảnh 1 lần
loi.KHONG_CO_QUYEN.anhChungChi=Ảnh chứng chỉ do quản trị viên quản lý, bác sĩ không sửa hoặc xoá được
loi.PHONG_CON_CA_LAM_VIEC.doiChuyenKhoa=Phòng khám còn {0} ca làm việc sắp tới nên không đổi chuyên khoa được; hãy chuyển các ca đó sang phòng khác trước
loi.PHONG_CON_CA_LAM_VIEC.ngungHoatDong=Phòng khám còn {0} ca làm việc sắp tới; hãy chuyển các ca đó sang phòng khác trước khi cho phòng ngừng hoạt động
