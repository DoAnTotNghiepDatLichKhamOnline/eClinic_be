# ----- Biến thể của mã lỗi: loi.<MA_LOI>.<bienThe> -----
loi.CHUYEN_KHOA_DANG_DUOC_SU_DUNG.soLuong=Chuyên khoa đang có {0} phòng khám và {1} bác sĩ, không thể xoá
