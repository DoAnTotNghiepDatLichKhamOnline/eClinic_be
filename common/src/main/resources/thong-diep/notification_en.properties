# ----- Appointment emails (MauEmail): the template key is the subject ({0} = booking code), <template>.moDau the opening -----
email.datLich=[eClinic] Appointment booked (code {0})
email.datLich.moDau=The appointment below <b>is confirmed</b>. Please bring the ticket (printed or its QR code) to the visit.
email.doiLich=[eClinic] Appointment rescheduled (new code {0})
email.doiLich.moDau=The appointment has been moved to the time below and the previous one is cancelled. The new appointment <b>is confirmed</b>.
email.nhacLich=[eClinic] Appointment reminder (code {0})
email.nhacLich.moDau=You have an upcoming appointment with the details below.
email.nhacLichChoXacNhan=[eClinic] Reminder: appointment not confirmed yet (code {0})
email.nhacLichChoXacNhan.moDau=You have an upcoming appointment with the details below. The doctor <b>has not confirmed it yet</b>; the ticket shows its latest status.
email.bacSiHuy=[eClinic] Appointment cancelled by the doctor (code {0})
email.bacSiHuy.moDau=The doctor has <b>cancelled</b> the appointment below. The reason is on the ticket. You can book another time on the booking page.
email.doiBacSi=[eClinic] Your appointment has a new doctor (code {0})
email.doiBacSi.moDau=The appointment below is now with <b>a different doctor</b>; the time and room are unchanged. If this does not suit you, you can reschedule or cancel on the ticket up to the appointment time, and it does not count toward your reschedule limit.
email.canDoiLich=[eClinic] Your appointment session was cancelled, please reschedule (code {0})
email.canDoiLich.moDau=The session of the appointment below <b>was cancelled</b>. Your appointment is kept: please move it to another time slot or cancel it on the ticket, up to the original appointment time; this does not count toward your reschedule limit.
email.quanTriHuy=[eClinic] Appointment cancelled by the hospital (code {0})
email.quanTriHuy.moDau=The hospital has <b>cancelled</b> the appointment below. The reason is on the ticket. You can book another time on the booking page.
email.capLaiLienKet=[eClinic] Your appointment ticket link (code {0})
