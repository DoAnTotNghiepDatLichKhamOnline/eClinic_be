email.capLaiLienKet.soKham=This visit has a <b>visit record</b>. To see the full result, enter the last 4 digits of the phone number used for the booking.
email.capLaiLienKet.nutSoKham=View visit record
email.taiKham=[eClinic] Follow-up visit recommended
