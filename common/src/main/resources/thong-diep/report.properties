baoCao.ghiChu.1=Lịch hẹn trong kỳ: lịch hẹn có lượt khám bắt đầu trong kỳ. Lịch cũ của 1 lần đổi lịch không tính, nên 1 lần đổi lịch chỉ là 1 lịch hẹn.
baoCao.ghiChu.2=Lượt khám: lịch hẹn đã khám xong. Bệnh nhân đã khám (duy nhất): mỗi hồ sơ bệnh nhân (duy nhất theo CCCD) tính 1 lần dù khám nhiều lượt.
baoCao.ghiChu.3=Đã hủy: bệnh nhân hủy + bác sĩ hủy + quản trị viên hủy. Tỷ lệ hủy = đã hủy / lịch hẹn trong kỳ.
baoCao.ghiChu.4=Tỷ lệ không đến = không đến / (đã khám + không đến): chỉ tính lịch đã biết bệnh nhân đến hay không, lịch sắp tới không làm giảm tỷ lệ.
baoCao.ghiChu.5=Tỷ lệ lấp đầy = lượt đã đặt / tổng lượt của các ca đang hoạt động trong kỳ. Ca bị hủy và ngày bệnh viện nghỉ không tính; bệnh nhân không đến vẫn tính là lượt đã đặt.
baoCao.ghiChu.6=Thời gian đặt trước = giờ bắt đầu lượt khám - lúc đặt lịch (lịch đổi: lúc đổi).
baoCao.ghiChu.7=Lượt đặt mới: lịch hẹn được tạo trong kỳ (trừ lịch cũ của 1 lần đổi lịch), cùng cách tính với ô "lượt đặt trong tháng" của Dashboard.
baoCao.ghiChu.8=Chuyên khoa là chuyên khoa hiện tại của bác sĩ. Bác sĩ đang công tác là số hiện tại, không theo kỳ; tài khoản bệnh nhân mới không lọc theo chuyên khoa.
baoCao.ghiChu.9=Tỷ lệ tính theo phần trăm, làm tròn 1 chữ số thập phân; để trống khi không có dữ liệu để tính.
