# ----- Email tài khoản: email.<ten>.<phan> (khung HTML ở EmailServiceImpl; giá trị {0} đã được escape) -----
email.chao=Xin chào {0},
email.chaoKhongTen=Xin chào,
email.lienKetDuPhong=Nếu nút không hoạt động, hãy mở liên kết sau:
email.xacThuc.tieuDe=[eClinic] Kích hoạt tài khoản
email.xacThuc.moDau=Cảm ơn bạn đã đăng ký tài khoản eClinic. Bấm nút bên dưới để kích hoạt tài khoản:
email.xacThuc.nut=Kích hoạt tài khoản
email.xacThuc.ketThuc=Liên kết có hiệu lực {0} giờ. Nếu bạn không đăng ký, hãy bỏ qua email này.
email.datLai.tieuDe=[eClinic] Đặt lại mật khẩu
email.datLai.moDau=Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản eClinic của bạn. Bấm nút bên dưới để đặt mật khẩu mới:
email.datLai.nut=Đặt lại mật khẩu
email.datLai.ketThuc=Liên kết có hiệu lực {0} phút và chỉ dùng được 1 lần. Nếu bạn không yêu cầu, hãy bỏ qua email này, mật khẩu của bạn không thay đổi.
email.doiMatKhau.tieuDe=[eClinic] Mật khẩu đã được thay đổi
email.doiMatKhau.doan1=Mật khẩu tài khoản eClinic của bạn vừa được thay đổi. Các thiết bị khác đang đăng nhập tài khoản này đã bị đăng xuất.
email.doiMatKhau.doan2=Nếu không phải bạn thực hiện, hãy dùng chức năng <b>Quên mật khẩu</b> ngay để lấy lại tài khoản và liên hệ phòng khám.
email.xacNhanDoiEmail.tieuDe=[eClinic] Xác nhận đổi email đăng nhập
email.xacNhanDoiEmail.moDau=Một tài khoản eClinic vừa yêu cầu dùng địa chỉ email này làm email đăng nhập. Bấm nút bên dưới để xác nhận:
email.xacNhanDoiEmail.nut=Xác nhận đổi email
email.xacNhanDoiEmail.ketThuc=Liên kết có hiệu lực {0} phút và chỉ dùng được 1 lần. Sau khi xác nhận, mọi thiết bị của tài khoản sẽ bị đăng xuất và phải đăng nhập lại bằng email này. Nếu bạn không yêu cầu, hãy bỏ qua email này.
email.yeuCauDoiEmail.tieuDe=[eClinic] Có yêu cầu đổi email đăng nhập
email.yeuCauDoiEmail.doan1=Tài khoản eClinic của bạn vừa có yêu cầu đổi email đăng nhập sang <b>{0}</b>. Email đăng nhập chưa thay đổi cho tới khi yêu cầu được xác nhận từ địa chỉ mới.
email.yeuCauDoiEmail.doan2=Nếu không phải bạn thực hiện, hãy <b>đổi mật khẩu</b> ngay: việc đổi mật khẩu sẽ huỷ yêu cầu này.
email.daDoiEmail.tieuDe=[eClinic] Email đăng nhập đã được thay đổi
email.daDoiEmail.doan1=Email đăng nhập tài khoản eClinic của bạn đã được đổi sang <b>{0}</b>. Mọi thiết bị đang đăng nhập tài khoản này đã bị đăng xuất; từ nay hãy đăng nhập bằng email mới.
email.daDoiEmail.doan2=Địa chỉ email này không còn gắn với tài khoản. Nếu không phải bạn thực hiện, hãy liên hệ phòng khám ngay để được hỗ trợ.
email.voHieuHoa.tieuDe=[eClinic] Tài khoản của bạn đã bị vô hiệu hoá
email.voHieuHoa.doan1=Tài khoản eClinic của bạn đã bị quản trị viên vô hiệu hoá. Mọi thiết bị đang đăng nhập tài khoản này đã bị đăng xuất và bạn không thể đăng nhập cho tới khi tài khoản được kích hoạt lại.
email.voHieuHoa.lyDo=Lý do: <b>{0}</b>
email.voHieuHoa.doan2=Nếu bạn cho rằng đây là nhầm lẫn, hãy liên hệ phòng khám để được hỗ trợ.
email.kichHoatLai.tieuDe=[eClinic] Tài khoản của bạn đã được kích hoạt lại
email.kichHoatLai.doan1=Tài khoản eClinic của bạn đã được quản trị viên kích hoạt lại. Bạn có thể đăng nhập và sử dụng hệ thống như bình thường.
email.chaoBacSi.tieuDe=[eClinic] Tài khoản bác sĩ của bạn đã được tạo
email.chaoBacSi.doan1=Phòng khám đã tạo tài khoản bác sĩ eClinic cho bạn với email đăng nhập <b>{0}</b>.
email.chaoBacSi.doan2=Hãy đăng nhập tại <a href="{0}">{0}</a> bằng mật khẩu ban đầu do phòng khám cung cấp. Ở lần đăng nhập đầu tiên, hệ thống sẽ yêu cầu bạn đặt mật khẩu của riêng mình trước khi sử dụng.
email.chaoBacSi.doan3=Nếu bạn không làm việc tại phòng khám, hãy bỏ qua email này.
