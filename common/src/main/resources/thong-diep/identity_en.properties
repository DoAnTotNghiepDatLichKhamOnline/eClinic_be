email.doiMatKhau.doan2=If this was not you, use <b>Forgot password</b> right away to recover your account and contact the clinic.
email.xacNhanDoiEmail.tieuDe=[eClinic] Confirm your new sign-in email
email.xacNhanDoiEmail.moDau=An eClinic account has asked to use this address as its sign-in email. Press the button below to confirm:
email.xacNhanDoiEmail.nut=Confirm email change
email.xacNhanDoiEmail.ketThuc=The link is valid for {0} minutes and can be used once. After you confirm, every device of the account is signed out and must sign in again with this email. If you did not ask for this, please ignore this email.
