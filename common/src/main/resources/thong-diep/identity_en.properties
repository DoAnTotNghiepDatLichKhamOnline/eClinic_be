email.yeuCauDoiEmail.doan1=A request was made to change the sign-in email of your eClinic account to <b>{0}</b>. The sign-in email does not change until the request is confirmed from the new address.
email.yeuCauDoiEmail.doan2=If this was not you, <b>change your password</b> right away: changing the password cancels this request.
email.daDoiEmail.tieuDe=[eClinic] Your sign-in email was changed
email.daDoiEmail.doan1=The sign-in email of your eClinic account was changed to <b>{0}</b>. Every device signed in to this account has been signed out; from now on, sign in with the new email.
email.daDoiEmail.doan2=This address is no longer linked to the account. If this was not you, contact the clinic right away for help.
email.voHieuHoa.tieuDe=[eClinic] Your account has been deactivated
email.voHieuHoa.doan1=Your eClinic account has been deactivated by an administrator. Every device signed in to this account has been signed out and you cannot sign in until the account is reactivated.
email.voHieuHoa.lyDo=Reason: <b>{0}</b>
email.voHieuHoa.doan2=If you believe this is a mistake, contact the clinic for help.
email.kichHoatLai.tieuDe=[eClinic] Your account has been reactivated
email.kichHoatLai.doan1=Your eClinic account has been reactivated by an administrator. You can sign in and use the system as usual.
email.chaoBacSi.tieuDe=[eClinic] Your doctor account has been created
email.chaoBacSi.doan1=The clinic has created an eClinic doctor account for you with the sign-in email <b>{0}</b>.
email.chaoBacSi.doan2=Sign in at <a href="{0}">{0}</a> with the initial password given by the clinic. At the first sign-in the system asks you to set your own password before you continue.
email.chaoBacSi.doan3=If you do not work at the clinic, please ignore this email.
