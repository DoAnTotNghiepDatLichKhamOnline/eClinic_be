# Cấu hình dùng chung, mỗi service nạp bằng spring.config.import: classpath:application-common.yml
spring:
  # Chạy bằng IntelliJ: đọc thêm .env ở thư mục gốc nếu có; biến môi trường vẫn được ưu tiên
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    # Không đặt serverTimezone: DATETIME lưu giờ địa phương, JVM đặt Asia/Ho_Chi_Minh (AppTimeZone.apply())
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eclinic}?characterEncoding=UTF-8
    username: ${DB_USERNAME:eclinic}
    password: ${DB_PASSWORD:eclinic}

  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý, Hibernate chỉ kiểm tra entity khớp schema
      ddl-auto: validate

  flyway:
    # Bật ở mọi service: Flyway có khoá trên MySQL nên khởi động đồng thời vẫn an toàn
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis lỗi thì mọi chỗ dùng đều có đường lui, nên chờ ngắn (đặt ở đây vì file import đè file của service)
      timeout: 500ms
      connect-timeout: 500ms

  # Thông điệp 2 ngôn ngữ: <ten>.properties tiếng Việt, <ten>_en.properties tiếng Anh, chọn theo Accept-Language
  messages:
    basename: thong-diep/chung,thong-diep/identity,thong-diep/catalog,thong-diep/booking,thong-diep/medical,thong-diep/notification,thong-diep/chatbot,thong-diep/report
    # Ngôn ngữ không có file riêng dùng tiếng Việt, không dùng ngôn ngữ của JVM
    fallback-to-system-locale: false
  web:
    # Request không gửi Accept-Language: tiếng Việt
    locale: vi

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  benh-an:
    # Số ngày bác sĩ được sửa hồ sơ bệnh án kể từ lúc ghi nhận (medical-service và booking-service cùng đọc)
    so-ngay-duoc-sua: ${RECORD_EDIT_DAYS:7}
  so-kham:
    # Link sổ khám (cũng là nội dung mã QR) = frontend-url + duong-dan + mã sổ khám
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    duong-dan: /so-kham/
    kich-thuoc-qr: 300
    # Nhập sai 4 số cuối SĐT đủ số lần này thì sổ khám bị khoá xem trong khoa-sau
    so-lan-sai-toi-da: 5
    khoa-sau: 15m
  # Kho ảnh Cloudinary; thiếu 1 trong 3 khoá thì API tải ảnh trả 503, service vẫn chạy
  cloudinary:
    # KHÔNG đặt "bat" ở đây: file import đè lên application.yml của service
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    # 2 DB dùng chung 1 tài khoản Cloudinary thì đặt thư mục khác nhau (ảnh đặt tên theo id)
    thu-muc: ${CLOUDINARY_FOLDER:eclinic}
    url-api: https://api.cloudinary.com
    # Nhỏ hơn read-timeout của gateway (30s) để lỗi kho ảnh ra 503 chứ không ra 504
    thoi-gian-cho: 20s
  noi-bo:
    # Khoá API nội bộ, giống nhau ở mọi service; đổi mặc định thì đổi cả KhoaNoiBo.KHOA_DEV_MAC_DINH
    khoa: ${INTERNAL_API_KEY:eclinic-dev-khoa-noi-bo-chi-dung-o-may-local-khong-dung-that}
  bao-mat:
    # Khoá ký JWT, giống nhau ở mọi service; đổi mặc định thì đổi cả JwtConfig.KHOA_DEV_MAC_DINH
    jwt-secret: ${JWT_SECRET:eclinic-dev-secret-chi-dung-o-may-local-khong-dung-that-2026}
    thoi-han-access-token: ${JWT_TTL:30m}
    # Đường dẫn công khai đặt trong application.yml của từng service (duong-dan-cong-khai)
