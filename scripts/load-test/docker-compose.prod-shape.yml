# Stack giống máy chủ thật (DOANTOTNGH-25): mọi container chung 2 CPU như VM e2-standard-2 (8 JVM + MySQL + Redis),
# Caddy đứng trước gateway với HTTPS như deploy/Caddyfile. Dùng kèm docker-compose.yml; đường dẫn tương đối tính từ
# thư mục gốc. Đặt biến môi trường của stack thử (xem đầu kiem-tra-tai.js), rồi từ thư mục gốc, Git Bash:
#   docker compose -p eclinicsmoke -f docker-compose.yml -f scripts/load-test/docker-compose.prod-shape.yml \
#          --profile app up -d --build --wait
#   ... đo (kiem-tra-tai.js với BASE_URL=https://caddy, kiem-tra-prod.js với https://localhost:8443 --insecure) ...
#   docker compose -p eclinicsmoke -f docker-compose.yml -f scripts/load-test/docker-compose.prod-shape.yml \
#          --profile app down -v
# k6 chạy trên các CPU khác (--cpuset-cpus 4-11) để không tranh CPU của stack.

x-hai-cpu: &hai-cpu
  cpuset: "0-1"

services:
  mysql: *hai-cpu
  redis: *hai-cpu
  phpmyadmin: *hai-cpu
  identity-service: *hai-cpu
  catalog-service: *hai-cpu
  booking-service: *hai-cpu
  medical-service: *hai-cpu
  notification-service: *hai-cpu
  chatbot-service: *hai-cpu
  report-service: *hai-cpu
  api-gateway: *hai-cpu

  caddy:
    <<: *hai-cpu
    image: caddy:2.8
    container_name: eclinic-caddy
    profiles: [app]
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./scripts/load-test/Caddyfile.prod-shape:/etc/caddy/Caddyfile:ro
    environment:
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
    depends_on:
      - api-gateway
