# Production override for the Google Cloud VM. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --no-build
# Only Caddy (80/443) faces the internet. MySQL and phpMyAdmin are bound to 127.0.0.1 (reach them by SSH tunnel).
# App images come from GHCR (built by CI, tagged with the commit SHA); IMAGE_TAG is kept in the VM .env by the deploy.

services:
  mysql:
    ports: !override
      - "127.0.0.1:3306:3306"
  redis:
    ports: !reset []
  phpmyadmin:
    ports: !override
      - "127.0.0.1:8090:80"

  identity-service:     { ports: !reset [], image: "ghcr.io/doantotnghiepdatlichkhamonline/eclinic-identity-service:${IMAGE_TAG:?IMAGE_TAG is not set, see README}" }
  catalog-service:      { ports: !reset [], image: "ghcr.io/doantotnghiepdatlichkhamonline/eclinic-catalog-service:${IMAGE_TAG:?IMAGE_TAG is not set, see README}" }
  booking-service:      { ports: !reset [], image: "ghcr.io/doantotnghiepdatlichkhamonline/eclinic-booking-service:${IMAGE_TAG:?IMAGE_TAG is not set, see README}" }
  medical-service:      { ports: !reset [], image: "ghcr.io/doantotnghiepdatlichkhamonline/eclinic-medical-service:${IMAGE_TAG:?IMAGE_TAG is not set, see README}" }
  notification-service: { ports: !reset [], image: "ghcr.io/doantotnghiepdatlichkhamonline/eclinic-notification-service:${IMAGE_TAG:?IMAGE_TAG is not set, see README}" }
  chatbot-service:      { ports: !reset [], image: "ghcr.io/doantotnghiepdatlichkhamonline/eclinic-chatbot-service:${IMAGE_TAG:?IMAGE_TAG is not set, see README}" }
  report-service:       { ports: !reset [], image: "ghcr.io/doantotnghiepdatlichkhamonline/eclinic-report-service:${IMAGE_TAG:?IMAGE_TAG is not set, see README}" }
  api-gateway:          { ports: !reset [], image: "ghcr.io/doantotnghiepdatlichkhamonline/eclinic-api-gateway:${IMAGE_TAG:?IMAGE_TAG is not set, see README}" }

  caddy:
    image: caddy:2.8
    container_name: eclinic-caddy
    profiles: [app]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway

volumes:
  caddy_data:
  caddy_config:
