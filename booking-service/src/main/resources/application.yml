server:
  port: 8084
  tomcat:
    # Phải lớn hơn giới hạn request của gateway (5MB), nếu không Tomcat ngắt kết nối và gateway trả 502 thay vì 413
    max-swallow-size: 10MB

spring:
  application:
    name: booking-service
  config:
    import: classpath:application-common.yml
  servlet:
    multipart:
      # Tệp Excel nhập lịch làm việc; vượt thì 413 TEP_QUA_LON
      max-file-size: 2MB
      max-request-size: 3MB
  # Thời gian chờ Redis đặt chung trong application-common.yml

app:
  bao-mat:
    # Không cần đăng nhập: khung giờ còn chỗ, đặt lịch, phiếu khám bằng mã ngẫu nhiên
    duong-dan-cong-khai:
      - GET /api/booking/khung-gio/**
      - POST /api/booking/lich-hen
      - GET /api/booking/phieu-kham/**
      # Hủy / đổi lịch bằng link phiếu khám + SĐT liên hệ
      - POST /api/booking/phieu-kham/**
      # Quy tắc đặt lịch cho trang đặt lịch và phiếu khám
      - GET /api/booking/quy-tac-dat-lich
      # Sổ khám bệnh bằng mã ngẫu nhiên: GET tóm tắt / mã QR, POST xem đầy đủ kèm 4 số cuối SĐT
      - GET /api/booking/so-kham/**
      - POST /api/booking/so-kham/**
      # Ngày bệnh viện nghỉ cho lịch của trang đặt lịch
      - GET /api/booking/ngay-nghi
      # Khách mất link xin cấp lại: link chỉ gửi tới email của lịch hẹn, có giới hạn số lần
      - POST /api/booking/cap-lai-lien-ket
      # API nội bộ cho catalog-service: không qua gateway, kiểm tra khoá nội bộ thay cho JWT
      - POST /noi-bo/bac-si/**
  # lich-lam-viec, dat-lich, danh-gia chỉ ghi dòng cau_hinh_he_thong đầu tiên; sau đó quản trị viên sửa qua API
  lich-lam-viec:
    # Bác sĩ chỉ gửi được yêu cầu đổi ca / xin nghỉ khi ca còn cách giờ bắt đầu ít nhất khoảng này
    gui-yeu-cau-truoc-toi-thieu: ${SHIFT_REQUEST_LEAD:24h}
    # Quản trị viên chỉ xếp được ca trong số ngày tới này (tính từ hôm nay)
    so-ngay-xep-truoc-toi-da: ${SHIFT_MAX_DAYS:90}
    # Tổng giờ các ca của 1 bác sĩ trong 1 tuần (thứ Hai - Chủ nhật) không vượt số giờ này
    so-gio-toi-da-moi-tuan: ${SHIFT_MAX_WEEKLY_HOURS:48}
    # Link trong email gửi lịch = phieu-kham.frontend-url + đường dẫn này
    duong-dan-lich-bac-si: ${DOCTOR_SCHEDULE_PATH:/doctor/work-schedule}
  thong-bao:
    # booking-service ghi sự kiện vào su_kien_thong_bao, job gửi sang notification-service
    url: ${NOTIFICATION_URL:http://localhost:8086}
    # Khoảng nghỉ giữa 2 lần job gửi (cũng là độ trễ tối đa của 1 thông báo)
    chu-ky-gui: ${BOOKING_NOTIFY_INTERVAL:5s}
    # Thời gian chờ kết nối / chờ phản hồi của notification-service
    thoi-gian-cho: 5s
  nhac-lich:
    # Các mốc nhắc trước giờ khám; để trống là không nhắc, mỗi mốc nhắc nhiều nhất 1 lần
    cac-moc: ${BOOKING_REMINDER_BEFORE:3d,1d}
    # Khoảng nghỉ giữa 2 lần job tìm lịch hẹn đến hạn nhắc
    chu-ky: ${BOOKING_REMINDER_INTERVAL:5m}
    # Chỉ nhắc trong khoảng giờ này; lịch đến hạn ban đêm được nhắc vào buổi sáng
    gui-tu: ${BOOKING_REMINDER_FROM:07:00}
    gui-den: ${BOOKING_REMINDER_TO:21:00}
    # Lượt khám còn cách ít hơn khoảng này thì không nhắc nữa
    con-toi-thieu: ${BOOKING_REMINDER_MIN_LEAD:2h}
    kich-thuoc-lo: 200
  nhac-tai-kham:
    # Báo và nhắc trước ngày tái khám bấy nhiêu ngày (0 = không nhắc trước); chu kỳ dùng chung nhac-lich
    truoc-ngay: ${FOLLOWUP_REMINDER_DAYS:7}
    # Link trong email tái khám = phieu-kham.frontend-url + đường dẫn này
    duong-dan-dat-lich: ${FOLLOWUP_BOOKING_PATH:/dat-lich}
  phieu-kham:
    # Link phiếu khám (cũng là nội dung mã QR) = frontend-url + duong-dan + mã phiếu khám
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    duong-dan: /phieu-kham/
    # Cạnh ảnh QR (pixel) khi request không gửi kichThuoc
    kich-thuoc-qr: 300
  dat-lich:
    # Lượt khám chỉ đặt được khi còn cách giờ bắt đầu ít nhất khoảng này
    dat-truoc-toi-thieu: ${BOOKING_MIN_LEAD:30m}
    # Chỉ đặt được lịch trong số ngày tới này (tính cả hôm nay)
    so-ngay-dat-truoc-toi-da: ${BOOKING_MAX_DAYS:30}
    # Số lịch sắp tới còn hiệu lực tối đa của 1 hồ sơ và của 1 SĐT liên hệ
    so-lich-hieu-luc-toi-da-moi-ho-so: ${BOOKING_MAX_ACTIVE_PER_PATIENT:3}
    so-lich-hieu-luc-toi-da-moi-so-dien-thoai: ${BOOKING_MAX_ACTIVE_PER_PHONE:5}
    # Số lần đặt tối đa từ 1 IP trong 1 cửa sổ (Redis lỗi thì bỏ qua giới hạn)
    so-lan-dat-toi-da-moi-ip: ${BOOKING_IP_LIMIT:20}
    cua-so-gioi-han-ip: ${BOOKING_IP_WINDOW:10m}
    # Bệnh nhân chỉ hủy / đổi được lịch khi còn cách giờ khám ít nhất khoảng này
    huy-doi-truoc-toi-thieu: ${BOOKING_CHANGE_LEAD:2h}
    # Số lần đổi lịch tối đa của 1 lần đặt
    so-lan-doi-lich-toi-da: ${BOOKING_MAX_RESCHEDULES:2}
  cap-lai-lien-ket:
    # Số lần khách tự xin tối đa cho 1 mã tra cứu và 1 IP trong 1 cửa sổ (Redis lỗi thì bỏ qua)
    so-lan-toi-da-moi-ma: ${RELINK_CODE_LIMIT:3}
    so-lan-toi-da-moi-ip: ${RELINK_IP_LIMIT:10}
    cua-so: ${RELINK_WINDOW:1h}
  danh-gia:
    # Bệnh nhân sửa được đánh giá đã gửi trong số ngày này kể từ lúc gửi
    so-ngay-duoc-sua: ${RATING_EDIT_DAYS:7}
