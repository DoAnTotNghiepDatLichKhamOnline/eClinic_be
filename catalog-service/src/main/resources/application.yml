server:
  port: 8082
  tomcat:
    # Upload vượt giới hạn multipart: Tomcat chỉ đọc bỏ phần body còn lại tối đa chừng này (mặc định 2MB), quá thì ngắt
    # kết nối trước khi trả xong response -> gateway báo 502 thay vì 413 TEP_QUA_LON. Phải LỚN HƠN giới hạn request
    # của gateway (app.gioi-han.kich-thuoc-request-toi-da = 5MB) để mọi request gateway cho qua đều được đọc hết.
    max-swallow-size: 10MB

spring:
  application:
    name: catalog-service
  config:
    import: classpath:application-common.yml

  servlet:
    multipart:
      # Ảnh giới thiệu bác sĩ (POST /api/catalog/quan-tri/bac-si/{id}/anh): tối đa 4MB mỗi tệp, vì gateway chặn mọi
      # request quá 5MB. Vượt -> 413 TEP_QUA_LON (XuLyLoiHandler).
      max-file-size: 4MB
      max-request-size: 5MB

app:
  # Dùng kho ảnh Cloudinary cho ảnh giới thiệu bác sĩ (cấu hình kết nối: app.cloudinary trong application-common.yml).
  # Mỗi ảnh 1 mã riêng: <thu-muc>/bac-si/<idBacSi>/<mã ngẫu nhiên>.
  cloudinary:
    bat: true
  # Quản lý bác sĩ: tài khoản do identity-service ghi, ca làm việc do booking-service ghi. catalog-service gọi thẳng API
  # nội bộ /noi-bo/** của 2 service này (không qua gateway), kèm khoá nội bộ app.noi-bo.khoa.
  dich-vu-noi-bo:
    identity-url: ${IDENTITY_URL:http://localhost:8081}
    booking-url: ${BOOKING_URL:http://localhost:8084}
    thoi-gian-cho-ket-noi: 5s
    # Dài: hủy mọi ca sắp tới của 1 bác sĩ chạy trong 1 lần gọi
    thoi-gian-cho-phan-hoi: 60s
  bao-mat:
    # Không cần đăng nhập: xem danh mục chuyên khoa, tìm bác sĩ
    duong-dan-cong-khai:
      - GET /api/catalog/chuyen-khoa/**
      - GET /api/catalog/bac-si/**
