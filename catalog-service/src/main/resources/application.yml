server:
  port: 8082
  tomcat:
    # Phải lớn hơn giới hạn request của gateway (5MB), nếu không Tomcat ngắt kết nối và gateway trả 502 thay vì 413
    max-swallow-size: 10MB

spring:
  application:
    name: catalog-service
  config:
    import: classpath:application-common.yml

  servlet:
    multipart:
      # Ảnh giới thiệu bác sĩ: tối đa 4MB mỗi tệp vì gateway chặn request quá 5MB
      max-file-size: 4MB
      max-request-size: 5MB

management:
  health:
    redis:
      # Redis chỉ làm cache (CacheConfig): Redis lỗi thì đọc thẳng DB, nên không được báo catalog-service DOWN
      enabled: false

app:
  # Ảnh giới thiệu bác sĩ lưu trên Cloudinary: <thu-muc>/bac-si/<idBacSi>/<mã ngẫu nhiên>
  cloudinary:
    bat: true
  # Gọi thẳng API nội bộ /noi-bo/** của identity-service và booking-service, kèm khoá nội bộ
  dich-vu-noi-bo:
    identity-url: ${IDENTITY_URL:http://localhost:8081}
    booking-url: ${BOOKING_URL:http://localhost:8084}
    thoi-gian-cho-ket-noi: 5s
    # Dài: hủy mọi ca sắp tới của 1 bác sĩ chạy trong 1 lần gọi
    thoi-gian-cho-phan-hoi: 60s
  bao-mat:
    # Không cần đăng nhập: xem danh mục chuyên khoa, tìm bác sĩ
    duong-dan-cong-khai:
      - GET /api/catalog/chuyen-khoa/**
      - GET /api/catalog/bac-si/**
