server:
  port: 8086

spring:
  application:
    name: notification-service
  config:
    import: classpath:application-common.yml

  # Máy chủ mail, chỉ dùng khi app.email.che-do = smtp (MAIL_APP_PASSWORD là App Password của Gmail)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${MAIL_SMTP_STARTTLS:true}
      # Không để job gửi mail treo vô hạn khi SMTP không phản hồi (ms)
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

management:
  health:
    mail:
      # Tắt để health check không đăng nhập máy chủ mail mỗi lần docker kiểm tra
      enabled: false

app:
  email:
    # console: chỉ ghi log, không gửi thật; smtp: gửi qua spring.mail, thiếu tài khoản thì không khởi động
    che-do: ${NOTIFICATION_MAIL_MODE:${MAIL_MODE:console}}
    smtp-xac-thuc: ${MAIL_SMTP_AUTH:true}
    # Khoảng nghỉ giữa 2 lần job gửi email đến hạn
    chu-ky-gui: ${NOTIFICATION_MAIL_INTERVAL:5s}
    # Gửi lỗi thì thử lại sau từng khoảng này; hết lượt thì email bị bỏ (THAT_BAI)
    cac-lan-cho: ${NOTIFICATION_MAIL_RETRY_WAITS:1m,5m,30m,2h}
    kich-thuoc-lo: 20
    so-ngay-giu: 30
  bao-mat:
    # API nội bộ tự kiểm tra khoá nội bộ (X-Khoa-Noi-Bo); gateway không chuyển tiếp đường dẫn này
    duong-dan-cong-khai:
      - POST /noi-bo/thong-bao
      - POST /noi-bo/email
